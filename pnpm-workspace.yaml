packages:
  - "packages/*"

# Pin transitive deps up out of their vulnerable ranges (Dependabot). Scoped so only
# the affected versions are bumped: yaml stack-overflow (GHSA-48c2-rrv3-qjmp) reaches us via
# yaml-language-server; esbuild dev-server file read (GHSA-g7r4-m6w7-qqqr) via tsup;
# fast-uri (GHSA-4c8g-83qw-93j6, GHSA-v2hh-gcrm-f6hx, the 3.1.6 host-confusion set, then
# GHSA-hrr3-gc8f-f4qj) via ajv, capped <4 to stay inside ajv's ^3 range; sharp
# (GHSA-f88m-g3jw-g9cj, then libheif GHSA-rgj7-g3m4-5g8c) via astro + miniflare (miniflare
# pins sharp exactly, so only an override can move it); svgo (GHSA-2p49-hgcm-8545, then
# removeScripts GHSA-w27v-7q3p-w38r) via astro.
overrides:
  "yaml@>=2.0.0 <2.8.3": ">=2.8.3"
  "esbuild@>=0.27.3 <0.28.1": ">=0.28.1"
  "fast-uri@>=3.0.0 <3.1.8": ">=3.1.8 <4"
  "sharp@<0.35.4": ">=0.35.4"
  "svgo@>=4.0.0 <4.1.0": ">=4.1.0"
  # postcss (GHSA-r28c-9q8g-f849) via vite and postcss-load-config.
  "postcss@<8.5.18": ">=8.5.18"
  # devalue (GHSA-j22f-vq7h-c4qm and five more, fixed in 5.9.3) via astro, which bundles it
  # into the Worker; capped <6 to stay inside astro's ^5 range.
  "devalue@<5.9.3": ">=5.9.3 <6"
  # undici (GHSA-w293-vg96-wgc3 and nine more, fixed in 7.29.1) via miniflare, which pins it
  # exactly, so only an override can move it. Pinned to exactly 7.29.1, the version newer
  # miniflare releases pin: 7.30.0 drops the default decompression size cap that the
  # GHSA-3xpg-4rpp-hhhm fix added.
  "undici@>=7.0.0 <7.29.1": "7.29.1"

# Allow these dependencies to run their install/build scripts (pnpm 10+ gates them
# by default). workerd backs @cloudflare/vitest-pool-workers; esbuild backs Vite/Vitest;
# sharp backs Astro's image service.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
