<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>ymmv</title>
  <!-- the logo mark (DESIGN.md → Brand): the aurora ramp, light to deep, with one diagonal cut.
       Mirrors .logo-mark in ymmv.css. -->
  <defs>
    <linearGradient id="ramp" x1="0.33" y1="0" x2="0.67" y2="1">
      <stop offset="0" stop-color="#d6ffef" />
      <stop offset="0.55" stop-color="#3ee6a8" />
      <stop offset="1" stop-color="#0e4f6b" />
    </linearGradient>
    <clipPath id="tile"><rect width="32" height="32" rx="9" /></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="32" height="32" fill="url(#ramp)" />
    <path d="M34 -2 -2 34" stroke="#050607" stroke-width="3.6" />
  </g>
</svg>
