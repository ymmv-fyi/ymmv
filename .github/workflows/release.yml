name: Release

# Three ways in:
#   • push a tag `vX.Y.Z`  → REAL production release: deploy the Worker, npm publish (provenance),
#                            then cut a GitHub Release with that version's CHANGELOG section as notes.
#   • workflow_dispatch from main, environment=production, dry_run off
#                          → web-only production deploy: the same gate and deploy-worker job, for a
#                            merged web change with no CLI release to tag. Nothing goes to npm and no
#                            GitHub Release is cut. It deploys the commit it captured, and stops if
#                            main has moved by the time it deploys, so an old run can't be re-run
#                            into production.
#                              gh workflow run release.yml --ref main -f environment=production -f dry_run=false
#   • any other workflow_dispatch → rehearsal: pick an environment + dry-run (default: staging,
#                            dry-run). The "tagged-release dry-run hits staging" check is this, with
#                            defaults. A dry run works from any ref. Staging with dry_run off really
#                            deploys staging, from main only.
#
# PRE-TAG CHECKLIST (a `vX.Y.Z` tag deploys STRAIGHT to production — there is no staging gate in the
# tag path). Sign-in fails CLOSED without its secret, and the gate job below never exercises the mint
# path. deploy-worker's smoke does, but only once the Worker is live: it stops the npm publish, not
# the login outage. Before tagging:
#   1. Set the Worker secret in BOTH envs (once, and after any rotation):
#        wrangler secret put GITHUB_CLIENT_SECRET --env staging
#        wrangler secret put GITHUB_CLIENT_SECRET --env production
#      Value = the ymmv GitHub OAuth app's client secret (GitHub → Settings → Developer settings →
#      OAuth Apps → ymmv). GITHUB_CLIENT_ID is a committed @ymmv/shared constant, not a secret.
#   2. Rehearse on staging (workflow_dispatch → staging) and run a real `ymmv login` against it. Only
#      tag once that succeeds.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare environment to target
        type: choice
        options: [staging, production]
        default: staging
      dry_run:
        description: "Dry run: no deploy, config + bundle validated only (a dispatch never publishes to npm)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Don't cancel an in-flight release; serialize per ref instead. A dispatch adds its inputs, so a
  # rehearsal from main never shares a group with a web-only deploy from main: a group keeps one
  # pending run, and a newer one replaces it.
  group: release-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}-{1}', inputs.environment, inputs.dry_run) || '' }}
  cancel-in-progress: false

jobs:
  # Resolve what this run does, in one place. Tag push is always a real production release;
  # dispatch honors its inputs.
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # the web-only deploy looks up this commit's CI run
    outputs:
      environment: ${{ steps.x.outputs.environment }}
      dry_run: ${{ steps.x.outputs.dry_run }}
      version: ${{ steps.x.outputs.version }}
      db_name: ${{ steps.x.outputs.db_name }}
    steps:
      - id: x
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            env_name=production
            dry=false
            version="${GITHUB_REF_NAME#v}"
          else
            env_name="${{ inputs.environment }}"
            dry="${{ inputs.dry_run }}"
            version="0.0.0-dispatch.${GITHUB_RUN_NUMBER}"
            # A dispatch really deploys only from main: for production that is the web-only deploy,
            # and main is what was reviewed and merged. The staging and production environments hold
            # the Cloudflare token and admit only main (and v* tags, for production), so deploy-worker
            # would refuse another ref after the whole gate ran. It stops here instead. It does not turn
            # into a dry run, which would report a deploy that never happened.
            if [ "$dry" != "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::A deploy by dispatch runs from main only (got $GITHUB_REF_NAME). Dispatch from main, or keep dry_run on."
              exit 1
            fi
          fi
          if [ "$env_name" = "production" ]; then db=ymmv; else db=ymmv-staging; fi
          {
            echo "environment=$env_name"
            echo "dry_run=$dry"
            echo "version=$version"
            echo "db_name=$db"
          } >> "$GITHUB_OUTPUT"
          echo "Release: env=$env_name dry_run=$dry version=$version db=$db"
      # A web-only deploy ships pages the gate below never renders: e2e runs only in ci.yml. So the
      # commit must already have a green CI run. (A tag is not held to this here: a merge right after
      # the cut cancels the cut's own CI run on main, and /release checks it before tagging.)
      - name: Require green CI for a web-only production deploy
        if: github.event_name == 'workflow_dispatch' && steps.x.outputs.environment == 'production' && steps.x.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          green=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          [ "$green" -ge 1 ] || { echo "::error::No green CI run for $GITHUB_SHA yet. Wait for CI on main, then dispatch again."; exit 1; }

  # Pre-flight gate — the same checks CI runs, on the LTS floor. Nothing publishes/deploys if red.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag check below walks history to main
      # A tag deploys straight to production, so it has to name a commit that is on main and that
      # the changelog was cut for. The cut lands through a rebase-merged PR, which gives the merged
      # commit a new sha: a tag on the cut branch's own commit would release code main never got.
      # A tag with no changelog section is a mistyped version or a release that was never cut.
      - name: Check the tag names a cut commit on main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || { echo "::error::$GITHUB_REF_NAME names $GITHUB_SHA, which is not on main."; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" 'index($0, "## [" ver "]") == 1 { found = 1 } END { exit !found }' CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no section for $version."; exit 1; }
          # This release deploys the tagged commit. If main has web changes past it and a web-only
          # deploy already put them live, production goes back to the tagged build.
          git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- packages/web packages/shared \
            || echo "::warning::main has web changes after $GITHUB_REF_NAME. If they were already deployed, dispatch the web deploy again after this release."
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Cache the fonts Astro downloads at build (Fontshare + Google) so the release build reuses them
      # instead of re-fetching; a provider outage then can't fail a cached build on the deploy path.
      - name: Cache Astro font downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/web/node_modules/.astro/fonts
          key: astro-fonts-${{ runner.os }}-${{ hashFiles('packages/web/astro.config.mjs') }}
          restore-keys: astro-fonts-${{ runner.os }}-
      - run: pnpm -r build
      - run: pnpm typecheck
      - run: pnpm test

  # Publish the CLI to npm with provenance. Real publish ONLY on a tag push (one npm registry, no
  # "staging npm"); every dispatch is --dry-run regardless of environment. Runs AFTER deploy-worker so
  # a tag release is sequenced (deploy the worker first, then publish the CLI) — no half-release if the
  # deploy fails, and the brief in-between window is the backward-compatible one (new worker, old CLI).
  # NOTE: `npm publish` is NOT idempotent — re-running the whole workflow after a successful publish
  # 403s at the registry. To retry a partially failed release, use `gh run rerun <id> --failed`.
  # If THIS job is the failed one, first check `npm view ymmv-cli@<version>`: if the version exists,
  # the publish landed despite the failure — don't rerun it; cut the GitHub Release by hand instead.
  publish-cli:
    needs: [prep, gate, deploy-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A tag push publishes from the production environment, which admits only v* tags and main. The
    # npm Trusted Publisher names this environment, so npm refuses a publish from a job outside it.
    # A dispatch only dry-runs the publish, so it runs outside any environment.
    environment: ${{ github.event_name == 'push' && 'production' || '' }}
    permissions:
      contents: read
      id-token: write # OIDC: Trusted Publishing auth + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.x. Pinned to the 11
      # major, NOT `@latest`: npm 12.0.0's provenance publish is broken (npm/cli#9722 — `npm publish`
      # dies with "Cannot find module 'sigstore'" from libnpmpublish/lib/provenance.js), and an
      # unpinned @latest silently put it on the publish path. Cross this major deliberately.
      # NOTE: the dispatch rehearsal runs `npm publish --dry-run`, which never exercises the
      # provenance/OIDC path — a staging rehearsal cannot catch a failure of this class.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      # Build the bundle (inlines the private @ymmv/shared) and stamp the release version.
      - run: pnpm --filter @ymmv/shared build
      - run: pnpm --filter ymmv-cli build
      - name: Stamp version
        # Pass via env, never inline ${{ }} into the script: a tag name is attacker-influenced and
        # would otherwise be shell-injected on the runner that holds OIDC npm-publish rights.
        env:
          VERSION: ${{ needs.prep.outputs.version }}
        run: npm pkg set version="$VERSION"
        working-directory: packages/cli
      - name: Publish to npm (Trusted Publishing + provenance)
        if: github.event_name == 'push' && needs.prep.outputs.dry_run == 'false'
        # No NODE_AUTH_TOKEN: auth is OIDC via the npm Trusted Publisher (id-token: write above).
        # Provenance is automatic under Trusted Publishing. A prerelease (v1.2.0-rc.1) goes out under
        # the `next` dist-tag: npm refuses one without a tag, by which point the Worker is deployed,
        # and `latest` has to stay on the newest stable release.
        env:
          VERSION: ${{ needs.prep.outputs.version }}
        run: |
          case "$VERSION" in
            *-*) npm publish --tag next ;;
            *) npm publish ;;
          esac
        working-directory: packages/cli
      # --tag: a dispatch stamps a prerelease version (0.0.0-dispatch.N), and npm refuses to publish
      # one without a tag, dry run included. Without it every rehearsal ended red.
      - name: Publish (dry run)
        if: github.event_name != 'push' || needs.prep.outputs.dry_run != 'false'
        run: npm publish --dry-run --tag dispatch
        working-directory: packages/cli

  # Deploy the unified Worker. The CLOUDFLARE_ENV build bakes the right name/bindings/routes into the
  # adapter's generated config, then wrangler deploys THAT (no --env). D1 migrations run against the
  # source config (--env). Dry-run validates config + bundle offline (no Cloudflare secrets needed).
  # CLOUDFLARE_ENV is scoped to the build step ONLY (see below) — it must NOT reach `wrangler deploy`.
  deploy-worker:
    needs: [prep, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Cloudflare secrets live in the staging and production environments, not the repo, so only
    # main (and v* tags, for production) can read them. A dry run needs no secrets and runs outside
    # both, from any ref.
    environment: ${{ needs.prep.outputs.dry_run == 'false' && needs.prep.outputs.environment || '' }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ymmv/shared build
      - name: Cache Astro font downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/web/node_modules/.astro/fonts
          key: astro-fonts-${{ runner.os }}-${{ hashFiles('packages/web/astro.config.mjs') }}
          restore-keys: astro-fonts-${{ runner.os }}-
      # Astro 7 bakes env at build time (CLOUDFLARE_ENV) — one build per environment. Scope
      # CLOUDFLARE_ENV to THIS step only: it selects the env for the baked config (name + bindings +
      # routes). If it also reached `wrangler deploy` below, wrangler would re-apply the env to the
      # already-baked config (which has no env blocks) and append `-<env>` to the worker name
      # (ymmv-production -> ymmv-production-production), diverging from the name that
      # `wrangler secret put --env <env>` targets — a silent secret/worker-name mismatch.
      - name: Build Worker for ${{ needs.prep.outputs.environment }}
        run: pnpm --filter @ymmv/web build
        env:
          CLOUDFLARE_ENV: ${{ needs.prep.outputs.environment }}
      # Guard against a silent rate-limit fail-open: RL_WRITE MUST be in the env-baked config, or the
      # handler's `if (!limiter) return null` would disable write rate limiting in production.
      - name: Assert RL_WRITE is bound
        run: grep -q "RL_WRITE" dist/server/wrangler.json || { echo "::error::RL_WRITE missing from generated config — rate limiting would silently fail open"; exit 1; }
        working-directory: packages/web
      # Same guard for the mint per-IP cap: RL_AUTH must be in the env-baked config, or checkAuthRateLimit's
      # `if (!limiter) return null` would disable the login flood cap in production.
      - name: Assert RL_AUTH is bound
        run: grep -q "RL_AUTH" dist/server/wrangler.json || { echo "::error::RL_AUTH missing from generated config — the mint per-IP cap would silently fail open"; exit 1; }
        working-directory: packages/web
      # Production is served only through its custom domains: workers_dev and preview_urls MUST both be
      # false in the env-baked config, or the Worker would also answer on workers.dev and per-version
      # preview URLs, origins outside canonicalHosts(). Staging lives on workers.dev, so production only.
      - name: Assert workers.dev and preview URLs are off
        if: needs.prep.outputs.environment == 'production'
        run: node -e "const c=require('./dist/server/wrangler.json');process.exit(c.workers_dev===false&&c.preview_urls===false?0:1)" || { echo "::error::workers_dev/preview_urls not false in generated config — production would serve workers.dev origins"; exit 1; }
        working-directory: packages/web
      # A dispatch deploys the commit it captured. If main has moved since (a newer merge, or a tag
      # release that deployed and published meanwhile), this build is older than what should be
      # live, possibly older than the published CLI expects. A re-run of an old dispatch stops here
      # too: dispatch again from main instead.
      - name: Check main has not moved (web-only deploy)
        if: github.event_name == 'workflow_dispatch' && needs.prep.outputs.environment == 'production' && needs.prep.outputs.dry_run == 'false'
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          [ "$tip" = "$GITHUB_SHA" ] || { echo "::error::main is at $tip, and this run captured $GITHUB_SHA. Dispatch again from main."; exit 1; }
      # REAL deploy (tag push, or a dispatch with dry_run=false): migrate D1 then upload.
      - name: Apply D1 migrations
        if: needs.prep.outputs.dry_run == 'false'
        run: pnpm exec wrangler d1 migrations apply ${{ needs.prep.outputs.db_name }} --env ${{ needs.prep.outputs.environment }} --remote
        working-directory: packages/web
      - name: Deploy
        if: needs.prep.outputs.dry_run == 'false'
        run: pnpm exec wrangler deploy -c dist/server/wrangler.json
        working-directory: packages/web
      # DRY RUN: validate the env-baked config + bundle without uploading (no secrets required).
      - name: Deploy (dry run)
        if: needs.prep.outputs.dry_run != 'false'
        run: pnpm exec wrangler deploy -c dist/server/wrangler.json --dry-run
        working-directory: packages/web
      # Production answers, reads D1 and can check a sign-in:
      #   • whoami with a junk bearer looks the token up in D1 and answers 401 (500 if the read fails).
      #     No user's profile is read: a profile can be renamed or deleted.
      #   • a sign-in with a junk token is the check on GITHUB_CLIENT_SECRET that the header asks
      #     for: 401 only when the secret is set and right (unset answers 500, wrong answers 503).
      # It runs on a production dry run too, against whatever is live, so the smoke itself can be
      # rehearsed. A failure stops publish-cli and leaves the new Worker live with the old CLI, the
      # backward-compatible skew: look at the site, then `gh run rerun <id> --failed`. A GitHub API
      # incident also fails the sign-in check (503).
      - name: Smoke production
        if: needs.prep.outputs.environment == 'production'
        env:
          DRY_RUN: ${{ needs.prep.outputs.dry_run }}
        run: |
          check() { # check <expected status> <label> <curl args...>
            want=$1; label=$2; shift 2
            for attempt in 1 2 3; do
              got=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$@") || true
              [ "$got" = "$want" ] && { echo "$label: $got"; return 0; }
              sleep 5
            done
            echo "::error::$label answered $got, expected $want"
            return 1
          }
          # Give a fresh deploy a moment to reach the edge, so the answers come from the new Worker.
          if [ "$DRY_RUN" = "false" ]; then sleep 15; fi
          check 200 "home" https://ymmv.fyi/
          check 401 "whoami with a junk bearer" -H 'authorization: Bearer release-smoke' https://ymmv.fyi/api/v1/auth/whoami
          check 401 "sign-in with a junk token" -X POST -H 'content-type: application/json' \
            -d '{"access_token":"release-smoke"}' https://ymmv.fyi/api/v1/auth/token

  # Cut a GitHub Release for the tag, with that version's CHANGELOG section as the notes. Runs LAST and
  # only after publish-cli (so transitively after the Worker deploy): a Release is the "fully shipped"
  # marker, so it must never exist for a release that failed to publish or deploy. It's also what the
  # CHANGELOG's `[x.y.z]: …/releases/tag/vX.Y.Z` footer links resolve to. `contents: write` is scoped to
  # THIS job; the top-level default stays read-only. gh + awk, not a third-party action — no new
  # supply-chain dependency, and the notes come from the CHANGELOG we already curate (one source).
  github-release:
    needs: [prep, publish-cli]
    if: github.event_name == 'push' && needs.prep.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create/edit the GitHub Release for this tag
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cut the GitHub Release from the CHANGELOG
        # Never inline the tag/version into the script — a ref name is attacker-influenced (same reason
        # the Stamp version step passes VERSION via env). The notes go through a file, so backticks and
        # asterisks in the changelog are never reparsed by the shell.
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prep.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          # Print the body of this version's section: everything between its `## [x.y.z]` header and the
          # next section header (or the `[x.y.z]: http…` link-ref block, for the oldest entry).
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { grab = 1; next }
            grab && /^## \[/        { exit }
            grab && /^\[.*\]: http/ { exit }
            grab                    { print }
          ' CHANGELOG.md > "$notes"
          # Drop leading blank lines (the section header is followed by one) for a tidy release body.
          sed -i -e '/./,$!d' "$notes"

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Idempotent re-run (e.g. a retried release): refresh title + notes, don't recreate.
            if [ -s "$notes" ]; then
              gh release edit "$TAG" --title "$TAG" --notes-file "$notes"
            else
              echo "::warning::No CHANGELOG section for $VERSION; leaving the existing release as-is."
            fi
          else
            flags=(--title "$TAG" --verify-tag)
            # A pre-release suffix (v1.2.0-rc.1) is flagged, so GitHub doesn't mark it "Latest".
            case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
            if [ -s "$notes" ]; then
              flags+=(--notes-file "$notes")
            else
              echo "::warning::No CHANGELOG section for $VERSION; using auto-generated notes."
              flags+=(--generate-notes)
            fi
            gh release create "$TAG" "${flags[@]}"
          fi
