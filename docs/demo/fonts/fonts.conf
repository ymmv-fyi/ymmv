<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The fonts demo.tape records in, for VHS's browser on Linux and WSL: record.sh points
     FONTCONFIG_FILE here. The system's own fonts, plus this directory. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">.</dir>
</fontconfig>
